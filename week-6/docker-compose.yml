version: '3.8'

services:
  web-ui:
    build: .
    container_name: zyroo_document_studio_ui
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./storage:/app/storage
      - ./workflow_repository.db:/app/workflow_repository.db
    environment:
      - ZYROO_STORAGE_DIR=/app/storage
      - ZYROO_DB_FILE=/app/workflow_repository.db
      - ZYROO_CONFIDENCE_THRESHOLD=0.75
      - ZYROO_HIGH_VALUE_THRESHOLD=10000.0
    restart: unless-stopped

  api-service:
    build: .
    container_name: zyroo_document_studio_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./workflow_repository.db:/app/workflow_repository.db
    environment:
      - ZYROO_STORAGE_DIR=/app/storage
      - ZYROO_DB_FILE=/app/workflow_repository.db
      - ZYROO_CONFIDENCE_THRESHOLD=0.75
      - ZYROO_HIGH_VALUE_THRESHOLD=10000.0
    restart: unless-stopped
